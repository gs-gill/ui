<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090b12">
  <title>Pulse</title>
  <link rel="stylesheet" href="/main.css">
  <script defer src="/socket.io/socket.io.js"></script>
  <script defer src="/index.js"></script>
</head>
<body class="chat-page">
  <div class="chat-shell">
    <aside class="conversation-sidebar" id="conversation-sidebar">
      <header class="sidebar-header"><a class="brand" href="/"><span class="brand-mark">P</span><span>pulse</span></a><button class="icon-button mobile-close" data-close-panel aria-label="Close conversations">×</button></header>
      <div class="sidebar-label"><span>Conversations</span><span id="total-unread" class="count-pill" hidden>0</span></div>
      <nav id="conversation-list" class="conversation-list" aria-label="Conversations"></nav>
      <div class="sidebar-footer"><div class="self-avatar" id="self-avatar"></div><div class="self-copy"><strong id="self-name"></strong><span><i class="status-dot"></i> Online now</span></div><button id="alert-toggle" class="icon-button" type="button" aria-label="Turn message alerts on" aria-pressed="false" title="Message alerts">🔔</button></div>
    </aside>

    <main class="chat-main">
      <header class="chat-header">
        <button id="open-conversations" class="icon-button mobile-only" aria-label="Open conversations">☰</button>
        <div class="active-avatar" id="active-avatar">#</div>
        <div class="active-copy"><h1 id="active-title">Main room</h1><p id="active-status">Everyone who's online</p></div>
        <div class="header-actions"><span id="connection-status" class="connection-pill"><i></i><span>Connecting</span></span><button id="open-people" class="icon-button people-button" aria-label="Show online people"><span>People</span><b id="online-count">0</b></button></div>
      </header>
      <section id="message-list" class="message-list" aria-live="polite" aria-label="Messages"></section>
      <div id="typing-indicator" class="typing-indicator" aria-live="polite"></div>
      <form id="composer" class="composer"><div class="composer-box"><textarea id="message-input" rows="1" maxlength="2000" placeholder="Message the room" aria-label="Message"></textarea><span class="composer-hint">Shift + Enter for a new line</span><button id="send-button" type="submit" aria-label="Send message">↗</button></div><p id="composer-error" class="composer-error" role="alert"></p></form>
    </main>

    <aside class="people-sidebar" id="people-sidebar">
      <header class="people-header"><div><p class="eyebrow">LIVE NOW</p><h2>People</h2></div><button class="icon-button mobile-close" data-close-panel aria-label="Close people">×</button></header>
      <p class="people-intro">Start a private conversation with anyone online.</p><div id="people-list" class="people-list"></div>
    </aside>
  </div>
  <div id="panel-backdrop" class="panel-backdrop"></div><div id="toast-region" class="toast-region" aria-live="assertive"></div>
</body>
</html>
